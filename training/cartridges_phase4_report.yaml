# Generate a versioned Phase 4 report after all four arms finish the same prefix.

name: cartridges-phase-4-report
workdir: ../..

resources:
  infra: kubernetes
  accelerators: H100-80GB:1
  image_id: docker:europe-west3-docker.pkg.dev/operator-agent-487820/ml-hackathon/prime-rl-base@sha256:a69f048650ac36d62da91effa337602c4541826558f7095eba9c47c433f7753b

envs:
  PHASE4_N: "240"
  PHASE4_RUN_ID: qwen3_4b_seed17_v1

run: |
  set -euo pipefail
  CARTRIDGES_WORKDIR="$PWD"
  CARTRIDGES_PYTHON=/app/.venv/bin/python
  test -d "$CARTRIDGES_WORKDIR/hackathon"
  VIRTUAL_ENV=/app/.venv uv pip install matplotlib

  PHASE4_ROOT="/persist/cartridges/phase4/${PHASE4_RUN_ID}"
  PHASE4_SUFFIX="$(printf '%03d' "$PHASE4_N")"
  PHASE4_REPORT_ROOT="${PHASE4_ROOT}/report_${PHASE4_SUFFIX}"
  test ! -e "$PHASE4_REPORT_ROOT"

  cd "$CARTRIDGES_WORKDIR/hackathon"
  "$CARTRIDGES_PYTHON" examples/phase4_report.py \
    --arm "cold=${PHASE4_ROOT}/cold/results_${PHASE4_SUFFIX}.json" \
    --arm "text64=${PHASE4_ROOT}/text64/results_${PHASE4_SUFFIX}.json" \
    --arm "still_single=${PHASE4_ROOT}/still_single/results_${PHASE4_SUFFIX}.json" \
    --arm "still_recurrent=${PHASE4_ROOT}/still_recurrent/results_${PHASE4_SUFFIX}.json" \
    --out "$PHASE4_REPORT_ROOT" \
    --phase3-oldest-fact-plot "/persist/cartridges/plots/phase_3_qwen3_4b_fixed64_v1/oldest_accuracy_vs_depth.png"
